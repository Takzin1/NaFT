name: Deploy NaFT Reviewer Demo to GitHub Pages

on:
  push:
    branches: [main, "hackathon/ieee-climatechain-2026"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Compile ClimateChain provenance contract
        run: npx --yes solc@0.8.24 --bin contracts/NaFTMRVAnchor.sol --output-dir /tmp/naft-solc
      - name: Run regression, impact proof and ClimateChain checks
        run: bash tests/run.sh
      - name: Verify committed generated reports
        run: git diff --exit-code -- reports/evaluation-kpis.json reports/mitou-impact-experiment.json reports/impact-proof.json

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
