name: NaFT MRV Compiler CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  core-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run Core regression, Compiler Corpus, syntax and security checks
        run: bash tests/run.sh
      - name: Browser click Reviewer Demo and verify live metrics
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/naft-http.log 2>&1 &
          server_pid=$!
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          "$chrome" --headless --no-sandbox --disable-gpu --remote-debugging-port=9222             --user-data-dir=/tmp/naft-chrome             "http://127.0.0.1:4173/naft-app.html#/reviewer-demo" >/tmp/naft-chrome.log 2>&1 &
          chrome_pid=$!
          trap 'kill $chrome_pid $server_pid 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:9222/json/list >/dev/null; then break; fi
            sleep 0.25
          done
          node tests/browser-reviewer-smoke.mjs
      - name: Verify reproducible Corpus KPI report
        run: git diff --exit-code -- reports/evaluation-kpis.json reports/mitou-impact-experiment.json
      - name: Check committed whitespace
        run: git diff --check HEAD^ HEAD
