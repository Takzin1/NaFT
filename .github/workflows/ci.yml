name: NaFT MRV Core CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  core-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run MRV correctness, syntax and security checks
        run: bash tests/run.sh
      - name: Check committed whitespace
        run: git diff --check HEAD^ HEAD
