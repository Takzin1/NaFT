name: NaFT MRV Compiler CI
on:
  # Feature branches are validated once through their PR, including stacked PRs.
  # Merged changes are checked again on main. No duplicate push + PR runs.
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run Core regression, Compiler Corpus, syntax and security checks
        run: bash tests/run.sh
      - name: Browser Reviewer, Evidence file, six-route and Compiler role-flow checks
        run: bash scripts/ci-browser-smoke.sh
      - name: Verify reproducible Corpus KPI report
        run: git diff --exit-code -- reports/evaluation-kpis.json reports/mitou-impact-experiment.json reports/impact-proof.json
      - name: Check committed whitespace
        run: git diff --check HEAD^ HEAD
