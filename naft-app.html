nywhere}.status{min-height:28px}.error{color:#982d26}.reviewer-header{padding-top:14px;padding-bottom:6px}.reviewer-header h1{font-size:24px;margin:4px 0}.reviewer-header p{margin:2px 0}.reviewer-home{float:right;font-size:13px}.reviewer-header+main{padding-top:8px}.reviewer-header+main .status{display:none}.reviewer-step,.reviewer-composition{padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:10px 0;background:#fbfcfb}.reviewer-step p,.reviewer-composition p{margin:4px 0}.reviewer-boundary{padding:10px 12px;background:#eef7f2;border-left:4px solid var(--accent)}.reviewer-cta{display:inline-block;margin:14px 0;padding:11px 16px;border-radius:8px;background:var(--ink);color:white;text-decoration:none}.reviewer-hero{border-width:2px}.metric-grid{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px;margin:18px 0}.metric{padding:14px;border:1px solid var(--line);border-radius:10px;background:#f9fbf9}.metric span,.metric small{display:block}.metric strong{display:block;font-size:30px;line-height:1.15;margin:4px 0}.flow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:16px 0}.flow span{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:white}.impact-detail{margin:10px 0;padding:14px}footer{font-size:13px;border-top:1px solid var(--line)}@media(max-width:640px){header,main,footer{padding:16px}.reviewer-header{padding:10px 14px 2px}.reviewer-header h1{font-size:21px;margin:2px 0}.reviewer-header p{font-size:12px;line-height:1.35}.reviewer-home{font-size:12px}.reviewer-header+main{padding:6px 14px 14px}.card{padding:16px}.reviewer-hero{padding:14px}.reviewer-hero h2{font-size:21px;line-height:1.25;margin-bottom:8px}nav a{font-size:13px;padding:8px}table{min-width:0;max-width:100%;table-layout:fixed}.scroll table{min-width:520px;table-layout:auto}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metric strong{font-size:25px}}
