<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NaFT — Version-aware MRV Evidence Compiler</title>
<style>
:root{color-scheme:light;--ink:#16362d;--muted:#53675f;--line:#d5dfd9;--paper:#f4f7f4;--accent:#175c45}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,sans-serif}header,main,footer{max-width:1160px;margin:auto;padding:24px}h1{font-size:clamp(25px,4vw,40px);line-height:1.2;margin:12px 0}h2{font-size:22px;margin-top:0}h3{font-size:17px}a{color:var(--accent)}nav{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}nav a{padding:10px 14px;background:white;border:1px solid var(--line);border-radius:8px;text-decoration:none}nav a[aria-current=page]{background:var(--accent);color:white}.row{display:flex;flex-wrap:wrap;align-items:end;gap:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{padding:22px;border:1px solid var(--line);background:white;border-radius:12px;margin-bottom:20px;overflow-wrap:anywhere}.notice{padding:14px 18px;border-left:4px solid #b58124;background:#fff5dd}.muted,small{color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase}.pill{display:inline-block;padding:3px 8px;background:#edf2ee;border-radius:5px;font-size:13px}label{display:block;font-size:14px}input,textarea,select,button{font:inherit}input,textarea,select{max-width:100%;border:1px solid #a8bab0;border-radius:6px;padding:8px;background:white}textarea{width:100%;min-height:100px}input[type=checkbox]{width:auto}button{border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:white;padding:9px 13px;cursor:pointer;margin:6px 6px 6px 0}button.secondary{background:white;color:var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}:focus-visible{outline:3px solid #c08625;outline-offset:3px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top;max-width:280px;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:450px;overflow:auto;font-size:12px}.mono,code{font-family:ui-monospace,monospace;overflow-wrap:anywhere}.status{min-height:28px}.error{color:#982d26}.reviewer-cta{display:inline-block;margin:14px 0;padding:11px 16px;border-radius:8px;background:var(--ink);color:white;text-decoration:none}.reviewer-hero{border-width:2px}.metric-grid{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px;margin:18px 0}.metric{padding:14px;border:1px solid var(--line);border-radius:10px;background:#f9fbf9}.metric span,.metric small{display:block}.metric strong{display:block;font-size:30px;line-height:1.15;margin:4px 0}.flow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:16px 0}.flow span{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:white}.impact-detail{margin:10px 0;padding:14px}footer{font-size:13px;border-top:1px solid var(--line)}@media(max-width:640px){header,main,footer{padding:16px}.card{padding:16px}nav a{font-size:13px;padding:8px}table{min-width:520px}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metric strong{font-size:25px}}
</style>
<script defer src="src/mrv-core.js"></script>
<script defer src="src/methodology-packs.js"></script>
<script defer src="src/mrv-compiler.js"></script>
<script defer src="src/compiler-session.js"></script>
<script defer src="src/compiler-demo.js"></script>
<script defer src="src/mrv-ui.js"></script>
</head>
<body><div id="app"><main>NaFT MRV Coreを読み込み中…</main></div><noscript>このローカル研究プロトタイプにはJavaScriptが必要です。</noscript></body>
</html>
