<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NaFT — 自然代替性トークン | 全国対応の地域GXウォレット基盤</title>
<style>
:root{
  --g950:#082b21;--g900:#0b3d2e;--g800:#11533f;--g700:#166a50;--g600:#1b8161;--g500:#27a374;--g400:#4dbb8f;
  --g100:#dff0e8;--g50:#f1f8f4;
  --gold:#a9821f;--gold-strong:#8a6a14;--gold-bg:#f9f3e0;
  --ink:#182620;--sub:#5c6f66;--faint:#8b9a92;--line:#e1e8e4;--bg:#f5f8f6;--card:#ffffff;
  --red:#bb4038;--red-bg:#fbecea;--amber:#93650f;--amber-bg:#fcf2da;--blue:#2e5f8a;--blue-bg:#e9f1f8;--gray-bg:#eef1ef;
  --radius:12px;
  --shadow:0 1px 2px rgba(12,40,30,.05),0 10px 26px -18px rgba(12,40,30,.28);
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP","Segoe UI",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:14.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--g700);text-decoration:none}
button{font-family:var(--font);cursor:pointer}
h1,h2,h3,h4{line-height:1.35;letter-spacing:.01em}
.mono{font-family:"SF Mono","Consolas","Menlo",monospace;letter-spacing:.02em}
.container{max-width:1120px;margin:0 auto;padding:0 24px}
.muted{color:var(--sub)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.right{text-align:right}.center{text-align:center}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}.mb24{margin-bottom:24px}
.flex{display:flex;align-items:center;gap:10px}.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wrap{flex-wrap:wrap}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:9px;border:1px solid transparent;padding:9px 18px;font-size:13.5px;font-weight:600;transition:.15s;white-space:nowrap}
.btn-p{background:var(--g800);color:#fff}.btn-p:hover{background:var(--g700)}
.btn-o{background:#fff;color:var(--g800);border-color:#c9d6d0}.btn-o:hover{border-color:var(--g600);color:var(--g700)}
.btn-ghost{background:transparent;color:var(--g800)}.btn-ghost:hover{background:var(--g50)}
.btn-gold{background:linear-gradient(135deg,#b98f24,#96731a);color:#fff}.btn-gold:hover{filter:brightness(1.06)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{filter:brightness(1.08)}
.btn-amber{background:#fff;color:var(--amber);border-color:#e3cf9a}.btn-amber:hover{background:var(--amber-bg)}
.btn-red-o{background:#fff;color:var(--red);border-color:#e5b8b4}.btn-red-o:hover{background:var(--red-bg)}
.btn-lg{padding:12px 26px;font-size:15px;border-radius:10px}
.btn-sm{padding:5px 12px;font-size:12.5px;border-radius:7px}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-p{padding:22px}
.section-title{font-size:16px;font-weight:700}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--g600);text-transform:uppercase}
/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2.5px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-green{background:var(--g100);color:var(--g800)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-gray{background:var(--gray-bg);color:var(--sub)}
.b-blue{background:var(--blue-bg);color:var(--blue)}
.b-gold{background:var(--gold-bg);color:var(--gold-strong)}
.b-outline{background:#fff;border:1px solid var(--line);color:var(--sub)}
/* forms */
.label{display:block;font-size:12.5px;font-weight:600;color:var(--sub);margin:14px 0 5px}
.input,.select,.textarea{width:100%;border:1px solid #cdd8d2;border-radius:9px;padding:9px 12px;font-size:14px;font-family:var(--font);background:#fff;color:var(--ink)}
.input:focus,.select:focus,.textarea:focus{outline:2px solid var(--g400);outline-offset:0;border-color:var(--g500)}
.textarea{min-height:96px;resize:vertical}
.field-note{font-size:11.5px;color:var(--faint);margin-top:4px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:99px;border:1px solid #ccd8d2;background:#fff;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;transition:.12s}
.chip:hover{border-color:var(--g500)}
.chip.on{background:var(--g800);border-color:var(--g800);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11.5px;color:var(--faint);font-weight:600;letter-spacing:.05em;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid #edf2ef;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl-wrap{overflow-x:auto}
.amount-pos{color:var(--g700);font-weight:700}.amount-neg{color:var(--ink);font-weight:700}
/* stat */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat .k{font-size:11.5px;color:var(--sub);font-weight:600}
.stat .v{font-size:22px;font-weight:800;letter-spacing:.01em;margin-top:2px}
.stat .u{font-size:12px;color:var(--faint);font-weight:600}
.stat .s{font-size:11px;color:var(--faint);margin-top:3px}
/* progress */
.prog{height:7px;background:#e8efeb;border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--g600),var(--g400));border-radius:99px}
/* project card */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:.15s}
.pcard:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(12,40,30,.06),0 16px 34px -18px rgba(12,40,30,.35)}
.pcard .ph{height:96px;display:flex;align-items:center;justify-content:center;font-size:38px;position:relative}
.pcard .ph .cat-tag{position:absolute;top:10px;left:10px}
.pcard .pb{padding:15px 16px 16px;display:flex;flex-direction:column;flex:1;gap:8px}
.pcard h3{font-size:14.5px;font-weight:700;line-height:1.45}
.meta-row{display:flex;flex-wrap:wrap;gap:5px;font-size:11.5px;color:var(--sub)}
.kv{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.kv b{color:var(--ink)}
/* shell */
.shell{display:flex;min-height:100vh}
.side{width:232px;background:var(--g950);color:#cfe3da;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .brand{padding:20px 20px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.side nav{padding:12px 10px;flex:1;overflow-y:auto}
.side .nav-label{font-size:10.5px;letter-spacing:.12em;color:#6e8a7f;padding:12px 12px 5px;font-weight:700}
.side a.nv{display:flex;align-items:center;gap:9px;padding:8.5px 12px;border-radius:8px;color:#c3d8cf;font-size:13.5px;font-weight:600;margin-bottom:1px}
.side a.nv:hover{background:rgba(255,255,255,.07);color:#fff}
.side a.nv.on{background:var(--g700);color:#fff}
.side .ubox{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:12px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.topbar h1{font-size:17px;font-weight:700}
.content{padding:26px 28px 48px;max-width:1180px;width:100%}
.disclaimer{background:var(--gold-bg);border:1px solid #ecd9a8;border-radius:10px;padding:12px 16px;font-size:11.5px;color:#6d5410;line-height:1.7}
.footer-note{padding:0 28px 34px;max-width:1180px}
/* logo */
.logo{display:inline-flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.02em}
.logo .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--g700),var(--g500));display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:15px;position:relative;overflow:hidden}
.logo .mark::after{content:"";position:absolute;right:-6px;bottom:-6px;width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.55)}
.logo b{font-size:16.5px}
.logo .sub-jp{display:block;font-size:9.5px;font-weight:600;color:var(--faint);letter-spacing:.14em;line-height:1}
/* wallet hero card */
.wallet-card{background:radial-gradient(120% 160% at 85% -20%,#1d7a58 0%,var(--g900) 55%,var(--g950) 100%);color:#fff;border-radius:16px;padding:24px 26px;position:relative;overflow:hidden;box-shadow:0 18px 40px -20px rgba(8,43,33,.7)}
.wallet-card::before{content:"";position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;border:1.5px solid rgba(200,170,80,.35)}
.wallet-card::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;border:1.5px solid rgba(200,170,80,.5)}
.wallet-card .wl{font-size:11px;letter-spacing:.13em;color:#9fc4b5;font-weight:700}
.wallet-card .bal{font-size:34px;font-weight:800;letter-spacing:.01em}
.wallet-card .bal .u{font-size:14px;font-weight:600;color:#b9d8cb}
.wallet-card .row2{display:flex;gap:30px;margin-top:14px;flex-wrap:wrap}
.wallet-card .mini .k{font-size:10.5px;color:#8fb8a8;letter-spacing:.1em;font-weight:700}
.wallet-card .mini .v{font-size:15px;font-weight:700}
.wcode{font-family:"SF Mono",Consolas,monospace;font-size:12px;background:rgba(255,255,255,.1);padding:3px 10px;border-radius:6px;letter-spacing:.06em}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,25,19,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:14px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 30px 70px -20px rgba(0,0,0,.45)}
.modal-h{padding:18px 22px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.modal-h h3{font-size:16px;font-weight:700}
.modal-b{padding:14px 22px 22px}
.modal-x{background:none;border:none;font-size:20px;color:var(--faint);line-height:1;padding:2px 6px}
.modal-lg{max-width:760px}
/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--g900);color:#fff;padding:11px 22px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:200;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);animation:tin .25s ease}
.toast.err{background:var(--red)}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
/* landing */
.pub-head{background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.pub-head .in{max-width:1120px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.pub-nav{display:flex;gap:22px;align-items:center;font-size:13.5px;font-weight:600}
.pub-nav a{color:var(--sub)}.pub-nav a:hover{color:var(--g800)}
.hero{background:linear-gradient(180deg,#ffffff 0%,var(--g50) 100%);border-bottom:1px solid var(--line)}
.hero .in{max-width:1120px;margin:0 auto;padding:70px 24px 60px;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
.hero h1{font-size:37px;font-weight:800;line-height:1.4;letter-spacing:.01em}
.hero h1 .hl{color:var(--g700)}
.hero p.lead{font-size:15px;color:var(--sub);margin-top:18px;line-height:1.9}
.hero-badge{display:inline-flex;gap:7px;align-items:center;background:#fff;border:1px solid var(--line);padding:5px 14px;border-radius:99px;font-size:12px;font-weight:700;color:var(--g700);margin-bottom:20px}
.circ-strip{background:var(--g950);color:#cfe3da}
.circ-strip .in{max-width:1120px;margin:0 auto;padding:22px 24px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.circ-strip .k{font-size:11px;color:#7fa798;letter-spacing:.1em;font-weight:700}
.circ-strip .v{font-size:21px;font-weight:800;color:#fff}
.circ-strip .v .u{font-size:12px;color:#9fc4b5;font-weight:600}
.sec{padding:64px 0}
.sec.alt{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sec h2{font-size:25px;font-weight:800;margin-top:8px}
.sec .sec-lead{color:var(--sub);margin-top:12px;max-width:640px;line-height:1.9}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:30px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px}
.fcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}
.fcard .ic{width:36px;height:36px;border-radius:9px;background:var(--g100);display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:12px}
.fcard h3{font-size:14.5px;font-weight:700;margin-bottom:6px}
.fcard p{font-size:12.5px;color:var(--sub);line-height:1.7}
.flow-step{display:flex;gap:14px;padding:16px 0;border-bottom:1px dashed var(--line)}
.flow-step:last-child{border-bottom:none}
.flow-step .n{width:30px;height:30px;border-radius:50%;background:var(--g800);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qr-holder{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;background:var(--g50);border-radius:12px;border:1px solid var(--line)}
.qr-holder img{border-radius:8px}
#qrbox{background:#fff;padding:12px;border-radius:10px;border:1px solid var(--line)}
.reward-card{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;box-shadow:var(--shadow)}
.reward-card .rt{background:linear-gradient(135deg,var(--g900),var(--g700));color:#fff;padding:14px 16px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.reward-card .rt h3{font-size:14px;font-weight:700;line-height:1.5}
.reward-card .rb{padding:14px 16px}
.reward-card.used .rt{background:linear-gradient(135deg,#5b6f66,#8b9a92)}
.rank-bar{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--g700),var(--g400));min-width:3px}
.alert-row{background:var(--red-bg)}
.notice-inline{background:var(--blue-bg);border:1px solid #c9dcec;color:var(--blue);border-radius:9px;padding:10px 14px;font-size:12px;line-height:1.7}
.empty{padding:44px 20px;text-align:center;color:var(--faint);font-size:13px}
.empty .big{font-size:30px;margin-bottom:8px}
.step-dots{display:flex;gap:6px;margin-bottom:18px}
.step-dots i{height:5px;flex:1;border-radius:99px;background:#e2eae5}
.step-dots i.on{background:var(--g600)}
.tabbar{display:flex;gap:4px;background:var(--gray-bg);padding:4px;border-radius:10px;width:fit-content}
.tabbar button{border:none;background:transparent;padding:7px 16px;border-radius:8px;font-size:13px;font-weight:600;color:var(--sub)}
.tabbar button.on{background:#fff;color:var(--g800);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.demo-acc{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff}
.demo-acc:hover{border-color:var(--g500)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters>div{min-width:130px}
.filters .label{margin-top:0}
@media(max-width:960px){
  .hero .in{grid-template-columns:1fr;padding:44px 24px 40px;gap:30px}
  .hero h1{font-size:28px}
  .g3,.g4,.pgrid,.stats{grid-template-columns:repeat(2,1fr)}
  .circ-strip .in{grid-template-columns:repeat(2,1fr)}
  .shell{flex-direction:column}
  .side{width:100%;height:auto;position:static;flex-direction:column}
  .side nav{display:flex;overflow-x:auto;padding:6px 10px;gap:2px}
  .side .nav-label{display:none}
  .side a.nv{white-space:nowrap;padding:7px 12px;margin-bottom:0}
  .side .ubox{display:none}
  .content,.topbar{padding-left:16px;padding-right:16px}
}
@media(max-width:600px){
  .g2,.g3,.g4,.pgrid,.stats,.form-grid{grid-template-columns:1fr}
  .pub-nav{display:none}
  .hero h1{font-size:24px}
}
.ieee .g2>*,.ieee .g4>*,.ieee .stats>*{min-width:0}
.ieee .mono,.ieee .tiny,.ieee .small{overflow-wrap:anywhere}
.ieee button:disabled{opacity:.45;cursor:not-allowed}
@media(max-width:600px){.ieee .stats{grid-template-columns:1fr!important}}
</style>
</head>

var db = null;
async function loadDB(){
  var migrated=false;
  var raw = await store.get(DB_KEY);
  if(raw){ try{ db = JSON.parse(raw); }catch(e){ db = null; } }
  if(!db || !db.version){ db = seedDB(); await saveDB(); }
  if(!db.verification_runs){ db.verification_runs=[]; migrated=true; }
  if(!db.environmental_records){ db.environmental_records=[]; migrated=true; }
  ['candidate_units','unit_transfers','unit_retirements'].forEach(function(k){if(!db[k]){db[k]=[];migrated=true;}});
  db.verification_runs.forEach(function(r){r.assistant_label='Deterministic Verification Assist';});
  if(db.version<3){ db.version=3; migrated=true; }
  if(!db.primary_schema_version){ensurePrimarySchema(db);migrated=true;}
  if(migrated) await saveDB();
}
async function saveDB(){ await store.set(DB_KEY, JSON.stringify(db)); }
async function resetDB(){ db = seedDB(); await saveDB(); }

    {key:'evidence',label:'証憑セット',status:evs.length>=2&&described===evs.length?'pass':(evs.length?'warn':'fail'),detail:evs.length+'件／説明あり '+described+'件'},
    {key:'traceability',label:'証憑の追跡性',status:evs.length&&Object.keys(uniqueNames).length===evs.length?'pass':(evs.length?'warn':'fail'),detail:evs.length?'ファイル名の重複 '+(evs.length-Object.keys(uniqueNames).length)+'件':'証憑なし'}
  ];
  if(suspicious.length) checks.push({key:'risk_signal',label:'未確定資料',status:'warn',detail:suspicious.join('、')});
  var criticalFail=checks.some(function(c){return c.status==='fail'&&['identity','quantification','methodology','evidence'].indexOf(c.key)>=0;});
  var hasReview=checks.some(function(c){return c.status!=='pass';});
  var outcome=criticalFail?'abstain':(hasReview?'needs_review':'ready_for_human_review');
  var missing=checks.filter(function(c){return c.status==='fail';}).map(function(c){return c.label;});
  var summary=outcome==='ready_for_human_review'?'主要項目は揃っています。人間の審査者が原資料と算定妥当性を最終確認してください。':
    (outcome==='needs_review'?'資料は審査可能ですが、未確定事項があります。人間による重点確認が必要です。':'根拠不足のため補助エンジンは結論を出しません。証憑を追加して再実行してください。');
  return {outcome:outcome,summary:summary,checks:checks,missing_items:missing,risk_signals:suspicious,
    hash_algorithm:'SHA-256',evidence_set_hash:digestText(canonicalize(evidenceSnapshot(evs))),input_fingerprint:digestText(canonicalize(verificationInput(p,evs))),generated_at:nowISO()};
}
function verificationRunsFor(projectId){ return (db.verification_runs||[]).filter(function(r){return r.project_id===projectId;}).sort(function(a,b){return new Date(b.generated_at)-new Date(a.generated_at);}); }

async function runVerificationAssist(projectId){

/* ---------- Off-chain candidate lifecycle: simulation only ---------- */
var CANDIDATE_BOUNDARY='Candidate Climate Unit — Simulation only. Not a formally issued carbon credit.';
var RETIREMENT_BOUNDARY='Retirement in this prototype means permanent removal from the demo candidate-unit balance. It is not a formal carbon-credit retirement in any external registry.';
function canReviewProject(p){
  return !!(p&&S.user&&(isPlatformRole(S.user.role)||(isAdminRole(S.user.role)&&(S.user.permitted_region_ids||[]).indexOf(p.region_id)>=0)));
}
function canOperateProject(p){
  var producer=producerOfUser(S.user&&S.user.id);
  return canReviewProject(p)||!!(p&&producer&&producer.id===p.producer_id);

function unitOf(id){return db.candidate_units.find(function(u){return u.id===id;});}
function quantityAtoms(n){
  if(typeof n!=='number'||!isFinite(n)||n<0) return null;
  var atoms=Math.round(n*1000000);
  return Number.isSafeInteger(atoms)&&n===atoms/1000000?atoms:null;
}
function holderBalance(u,holder){var h=u.holder_balances.find(function(b){return b.holder===holder;});return h?h.quantity:0;}
function setHolderBalance(u,holder,atoms){
  var h=u.holder_balances.find(function(b){return b.holder===holder;});
  if(h) h.quantity=atoms/1000000; else u.holder_balances.push({holder:holder,quantity:atoms/1000000});
}
async function candidateBlocked(action,id,code){
  var u=unitOf(id),r=db.environmental_records.find(function(x){return x.id===id;});
  audit(action,'candidate_unit',id,code+' | Simulation only');

async function issueCandidateUnit(recordId){

  var actor=S.user.id;
  if(!record||record.hash_algorithm!=='SHA-256') return candidateBlocked('candidate_unit_issue_blocked',recordId,'REVERIFY_LEGACY_RECORD');
  var hash=await sha256Canonical(recordPayload(record));
  // No await between final authorization/duplicate validation and the writes below.
  if(!S.user||S.user.id!==actor||!canOperateProject(p)) return candidateBlocked('candidate_unit_issue_blocked',recordId,'HUMAN_ACTION_REQUIRED');
  if(projectOf(p.id)!==p||db.environmental_records.indexOf(record)<0) return candidateBlocked('candidate_unit_issue_blocked',recordId,'STALE_VERIFICATION_BLOCKED');
  if(hash!==digestText(canonicalize(recordPayload(record)))||hash!==record.environmental_record_hash||record.record_hash!=='NAFT-ER-'+hash.toUpperCase()) return candidateBlocked('candidate_unit_issue_blocked',recordId,'RECORD_INTEGRITY_BLOCKED');
  var run=db.verification_runs.find(function(r){return r.id===record.verification_run_id;});
  var reviewer=findUser(record.final_reviewer_id);
  if(p.review_status!=='approved'||record.status!=='verified_candidate'||!run||run.final_decision!=='approved'||!reviewer||!(isAdminRole(reviewer.role)||isPlatformRole(reviewer.role))||run.final_reviewer_id!==reviewer.id)
    return candidateBlocked('candidate_unit_issue_blocked',recordId,'HUMAN_APPROVAL_REQUIRED');
  if(!verificationRunIsCurrent(p,run)||record.input_fingerprint!==run.input_fingerprint) return candidateBlocked('candidate_unit_issue_blocked',recordId,'STALE_VERIFICATION_BLOCKED');
  if(run.outcome==='abstain'&&String(record.final_comment||'').trim().length<20) return candidateBlocked('candidate_unit_issue_blocked',recordId,'ABSTAIN_OVERRIDE_REQUIRED');

  if(db.candidate_units.some(function(u){return u.environmental_record_id===recordId||u.input_fingerprint===record.input_fingerprint||u.issuance_fingerprint===fingerprint;}))
    return candidateBlocked('candidate_unit_issue_blocked',recordId,'DUPLICATE_ISSUANCE_BLOCKED');
  var atoms=quantityAtoms(Number(record.estimated_co2_reduction));
  if(!atoms||!record.vintage||!record.methodology_reference) return candidateBlocked('candidate_unit_issue_blocked',recordId,'QUANTIFICATION_REQUIRED');
  var unit={id:uid('cu'),project_id:p.id,environmental_record_id:recordId,input_fingerprint:record.input_fingerprint,issuance_fingerprint:fingerprint,vintage:record.vintage,quantity_total:atoms/1000000,quantity_available:atoms/1000000,quantity_retired:0,unit:record.unit,methodology_reference:record.methodology_reference,status:'active_candidate',credit_status:'candidate_not_formally_issued',created_by:actor,created_at:nowISO(),holder_balances:[{holder:'demo_operator',quantity:atoms/1000000}]};
  db.candidate_units.unshift(unit); candidateTx(unit,'candidate_unit_issue',unit.quantity_total);

}
function transferPayload(t){var payload=Object.assign({},t);delete payload.transfer_hash;return payload;}
function appendUnitTransfer(u,from,to,quantity,type,reason){
  var previous=db.unit_transfers.find(function(t){return t.candidate_unit_id===u.id;});
  var t={id:uid('ut'),candidate_unit_id:u.id,from_holder:from,to_holder:to,quantity:quantity,transfer_type:type,reason:reason||'',previous_transfer_hash:previous?previous.transfer_hash:null,created_by:S.user.id,created_at:nowISO(),ledger_mode:'offchain_simulation'};
  t.transfer_hash=digestText(canonicalize(transferPayload(t))); db.unit_transfers.unshift(t);return t;
}
function unitOperationError(u,quantity,holder){
  if(!u) return 'UNIT_NOT_FOUND';
  if(!canReviewProject(projectOf(u.project_id))) return 'HUMAN_REVIEWER_REQUIRED';
  if(u.status==='fully_retired'||u.quantity_available===0) return 'RETIRED_UNITS_CANNOT_BE_REUSED';
  if(u.status!=='active_candidate'||projectOf(u.project_id).review_status!=='approved') return 'INACTIVE_CANDIDATE';
  var atoms=quantityAtoms(quantity);
  if(!atoms) return 'INVALID_QUANTITY';
  if(atoms>quantityAtoms(u.quantity_available)) return 'AVAILABLE_QUANTITY_EXCEEDED';
  if(atoms>quantityAtoms(holderBalance(u,holder))) return 'HOLDER_BALANCE_EXCEEDED';

}
async function transferCandidateUnit(unitId,fromHolder,toHolder,quantity){
  var u=unitOf(unitId),error=unitOperationError(u,quantity,fromHolder);
  if(error) return candidateBlocked('candidate_unit_transfer_blocked',unitId,error);
  // Fixed simulated custody accounts; no money, wallets, or user-to-user points.
  if(['demo_operator','demo_partner'].indexOf(fromHolder)<0||['demo_operator','demo_partner'].indexOf(toHolder)<0||fromHolder===toHolder)
    return candidateBlocked('candidate_unit_transfer_blocked',unitId,'INVALID_DEMO_HOLDER');
  var atoms=quantityAtoms(quantity);
  setHolderBalance(u,fromHolder,quantityAtoms(holderBalance(u,fromHolder))-atoms);
  setHolderBalance(u,toHolder,quantityAtoms(holderBalance(u,toHolder))+atoms);
  var transfer=appendUnitTransfer(u,fromHolder,toHolder,quantity,'demo_transfer');
  candidateTx(u,'candidate_unit_transfer',quantity);audit('candidate_unit_transferred','candidate_unit',u.id,transfer.id+' | '+quantity+' '+u.unit+' | simulation-only transfer');
  S.candidateMessage={code:'Transfer recorded',blocked:false,project_id:u.project_id};
  await saveDB();render();return {ok:true,transfer:transfer};
}
async function retireCandidateUnit(unitId,quantity,reason,holder){
  holder=holder||'demo_partner';
  var u=unitOf(unitId),error=unitOperationError(u,quantity,holder);
  if(error) return candidateBlocked('candidate_unit_retirement_blocked',unitId,error);
  if(typeof reason!=='string'||!reason.trim()) return candidateBlocked('candidate_unit_retirement_blocked',unitId,'RETIREMENT_REASON_REQUIRED');
  var atoms=quantityAtoms(quantity);
  setHolderBalance(u,holder,quantityAtoms(holderBalance(u,holder))-atoms);
  u.quantity_available=(quantityAtoms(u.quantity_available)-atoms)/1000000;
  u.quantity_retired=(quantityAtoms(u.quantity_retired)+atoms)/1000000;
  if(u.quantity_available===0) u.status='fully_retired';
  var transfer=appendUnitTransfer(u,holder,'demo_retirement_sink',quantity,'retirement_transfer',reason.trim());
  var retirement={id:uid('urc'),candidate_unit_id:u.id,transfer_id:transfer.id,quantity:quantity,reason:reason.trim(),holder:holder,created_by:S.user.id,created_at:nowISO(),retirement_type:'demo_only'};
  db.unit_retirements.unshift(retirement); candidateTx(u,'candidate_unit_retirement',quantity);
  audit('candidate_unit_retired','candidate_unit',u.id,retirement.id+' | '+reason.trim()+' | Simulation only');
  S.candidateMessage={code:'Retired — '+u.quantity_retired+' '+u.unit,blocked:false,project_id:u.project_id};
  await saveDB();render();return {ok:true,retirement:retirement};
}

function createEnvironmentalRecord(p,run,comment,prepared){
  var current=environmentalRecordFor(p.id); if(current&&current.input_fingerprint===run.input_fingerprint) return current;
  var previous=(db.environmental_records||[])[0];

  return record;
}

function marketFilterBar(base){
  var f=S.mf;
  var prefs = Array.from(new Set(db.regions.map(function(r){return r.prefecture;})));
  return '<div class="card card-p mb16"><div class="filters">'
    +'<div style="flex:1;min-width:200px"><span class="label">キーワード検索</span><input class="input" id="mf-q" value="'+esc(f.q)+'" placeholder="プロジェクト名・地域名・実施者名" onkeydown="if(event.key===\'Enter\')applyMF(\''+base+'\')"></div>'
    +'<div><span class="label">都道府県</span><select class="select" id="mf-pref">'+'<option value="">すべて</option>'+prefs.map(function(p){return '<option'+(f.pref===p?' selected':'')+'>'+p+'</option>';}).join('')+'</select></div>'
    +'<div style="min-width:200px"><span class="label">地域エリア</span><select class="select" id="mf-region">'+regionOptions(f.region,'すべての地域')+'</select></div>'
    +'<div><span class="label">カテゴリ</span><select class="select" id="mf-cat">'+catOptions(f.cat,'すべて')+'</select></div>'
    +'<div><span class="label">並び順</span><select class="select" id="mf-sort">'
      +'<option value="new"'+(f.sort==='new'?' selected':'')+'>新着順</option><option value="amount"'+(f.sort==='amount'?' selected':'')+'>支援額順</option><option value="co2"'+(f.sort==='co2'?' selected':'')+'>CO2削減量順</option><option value="progress"'+(f.sort==='progress'?' selected':'')+'>進捗率順</option></select></div>'
    +'<div><button class="btn btn-p" onclick="applyMF(\''+base+'\')">検索</button></div>'
    +'</div></div>';
}
function applyMF(base){
  S.mf = { q:document.getElementById('mf-q').value.trim(), pref:document.getElementById('mf-pref').value, region:document.getElementById('mf-region').value, cat:document.getElementById('mf-cat').value, sort:document.getElementById('mf-sort').value };
  render();
}
function filteredProjects(){
  var f=S.mf;
  var list = db.projects.filter(function(p){ return p.review_status==='approved'; });
  if(f.pref) list=list.filter(function(p){return p.prefecture===f.pref;});
  if(f.region) list=list.filter(function(p){return p.region_id===f.region;});
  if(f.cat) list=list.filter(function(p){return p.category===f.cat;});
  if(f.q){ var q=f.q.toLowerCase(); list=list.filter(function(p){ return (p.title+p.prefecture+p.municipality+p.area_name+producerName(p.producer_id)+p.description+(CATS[p.category]?CATS[p.category][0]:'')).toLowerCase().indexOf(q)>=0; }); }
  if(f.sort==='amount') list.sort(function(a,b){return b.current_amount-a.current_amount;});
  else if(f.sort==='co2') list.sort(function(a,b){return b.estimated_co2_reduction-a.estimated_co2_reduction;});
  else if(f.sort==='progress') list.sort(function(a,b){return pct(b.current_amount,b.target_amount)-pct(a.current_amount,a.target_amount);});
  else list.sort(function(a,b){return new Date(b.created_at)-new Date(a.created_at);});
  return list;
}
function marketBody(base){
  var list = filteredProjects();
  return marketFilterBar(base)
    +'<div class="between mb16"><span class="small muted">承認済みプロジェクト '+list.length+'件（審査を通過したプロジェクトのみ掲載しています）</span></div>'
    +(list.length?'<div class="pgrid">'+list.map(function(p){return projectCard(p,base);}).join('')+'</div>'
      :'<div class="empty"><div class="big">🔎</div>条件に合うプロジェクトが見つかりません。条件を変えて検索してください。</div>');
}

async function quickLogin(email){
  document.getElementById('lg-email').value = email; document.getElementById('lg-pw').value='demo1234'; await doLogin();
}
async function doLogin(){
  var email = document.getElementById('lg-email').value.trim().toLowerCase();
  var pw = document.getElementById('lg-pw').value;
  var u = db.users.find(function(x){return x.email===email;});
  if(!u || u.password_hash!==hashPw(pw)){ toast('メールアドレスまたはパスワードが正しくありません',true); return; }
  if(u.status!=='active'){ toast('このアカウントは現在利用できません',true); return; }
  S.user = u; await store.set(SES_KEY,u.id);
  audit('login','user',u.id,u.name+' がログイン'); await saveDB();
  toast('ログインしました');
  go(u.onboarded===false ? '#/onboarding' : roleHome(u.role));
}
function pgRegister(){
  return authFrame('<div class="card card-p"><h2 style="font-size:19px;font-weight:800">新規登録</h2><p class="small muted mt8">全国どこからでも、地域GXに参加できます。</p>'
    +'<span class="label">お名前</span><input class="input" id="rg-name" placeholder="例：山田 花子">'
    +'<span class="label">メールアドレス</span><input class="input" id="rg-email" placeholder="you@example.jp">'

    +'<span class="label">登録種別</span><select class="select" id="rg-role"><option value="citizen">市民として参加する</option><option value="producer">事業者・生産者として参加する</option></select>'
    +'<div id="rg-org-wrap" style="display:none"><span class="label">事業者・団体名</span><input class="input" id="rg-org" placeholder="例：〇〇グリーンファーム"></div>'
    +'<button class="btn btn-p btn-lg btn-block mt24" onclick="doRegister()">登録してオンボーディングへ</button>'
    +'<div class="tiny muted mt16" style="line-height:1.8">'+esc(DISCLAIMER)+'</div>'
    +'<div class="small muted mt16 center">すでにアカウントをお持ちの方は <a href="#/login"><b>ログイン</b></a></div></div>'
    +'<script>document.getElementById("rg-role").onchange=function(){document.getElementById("rg-org-wrap").style.display=this.value==="producer"?"block":"none"}<\/script>');

async function doRegister(){
  var name=document.getElementById('rg-name').value.trim(), email=document.getElementById('rg-email').value.trim().toLowerCase(), pw=document.getElementById('rg-pw').value, role=document.getElementById('rg-role').value, org=(document.getElementById('rg-org')||{value:''}).value.trim();
  if(!name){ toast('お名前を入力してください',true); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast('メールアドレスの形式が正しくありません',true); return; }
  if(pw.length<6){ toast('パスワードは6文字以上にしてください',true); return; }
  if(db.users.some(function(u){return u.email===email;})){ toast('このメールアドレスは既に登録されています',true); return; }
  if(role==='producer'&&!org){ toast('事業者・団体名を入力してください',true); return; }
  var u = {id:uid('u'),name:name,email:email,password_hash:hashPw(pw),role:role,home_region_id:null,selected_region_id:null,support_region_ids:[],interests:[],permitted_region_ids:[],status:'active',onboarded:false,created_at:nowISO()};
  db.users.push(u);
  db.wallets.push({id:uid('w'),user_id:u.id,wallet_code:walletCode(),wallet_address:null,demo_stable_balance:0,naft_point_balance:0,total_supported_amount:0,total_co2_contribution:0,supported_project_ids:[],status:'active',created_at:nowISO()});
  if(role==='producer') db.producers.push({id:uid('p'),user_id:u.id,organization_name:org,description:'',region_id:null,contact_email:email,address:'',verification_status:'pending',created_at:nowISO()});
  S.user=u; await store.set(SES_KEY,u.id);
  audit('user_register','user',u.id,name+'（'+ROLE_MAP[role]+'）が新規登録');
  await saveDB();
  S.ob={step:1,home:'',support:[],cats:[]};
  go('#/onboarding');
}
async function doLogout(){
  audit('logout','user',S.user.id,S.user.name+' がログアウト'); await saveDB();
  S.user=null; await store.del(SES_KEY); toast('ログアウトしました'); go('#/');
}

function pgOnboarding(){
  var ob=S.ob;
  var dots='<div class="step-dots">'+[1,2,3].map(function(i){return '<i class="'+(i<=ob.step?'on':'')+'"></i>';}).join('')+'</div>';
  var inner='';
  if(ob.step===1){
    inner='<h2 style="font-size:18px;font-weight:800">お住まいの地域を選んでください</h2><p class="small muted mt8">近くの地域GXを見るために使います。あとから変更できます。</p>'
      +'<span class="label">居住地域</span><select class="select" id="ob-home">'+regionOptions(ob.home,'選択してください')+'</select>'
      +'<div class="field-note">お住まいの地域がまだ登録されていない場合は、近いエリアか、応援したい地域を選んでください。</div>'
      +'<button class="btn btn-p btn-lg btn-block mt24" onclick="obNext1()">次へ：応援したい地域を選ぶ</button>';
  } else if(ob.step===2){
    inner='<h2 style="font-size:18px;font-weight:800">あなたが応援したい地域を選んでください</h2><p class="small muted mt8">ふるさとのGXを応援する。旅先で出会ったまちを応援する。複数選べます。</p>'
      +'<div class="chips mt16">'+db.regions.map(function(r){var on=ob.support.indexOf(r.id)>=0;return '<span class="chip'+(on?' on':'')+'" onclick="obToggle(\'support\',\''+r.id+'\')">'+esc(r.prefecture)+'｜'+esc(r.municipality)+'</span>';}).join('')+'</div>'
      +'<div class="flex mt24"><button class="btn btn-o" onclick="S.ob.step=1;render()">戻る</button><button class="btn btn-p btn-lg" style="flex:1" onclick="obNext2()">次へ：関心カテゴリを選ぶ</button></div>';
  } else {
    inner='<h2 style="font-size:18px;font-weight:800">関心のあるカテゴリを選んでください</h2><p class="small muted mt8">カテゴリから探す際のおすすめ表示に使います。</p>'
      +'<div class="chips mt16">'+Object.keys(CATS).map(function(c){var on=ob.cats.indexOf(c)>=0;return '<span class="chip'+(on?' on':'')+'" onclick="obToggle(\'cats\',\''+c+'\')">'+CATS[c][1]+' '+CATS[c][0]+'</span>';}).join('')+'</div>'
      +'<div class="card card-p mt24" style="background:var(--g50);box-shadow:none"><b class="small">🎁 オンボーディング完了で</b><div style="font-size:20px;font-weight:800;color:var(--g700)">PoC用 NaFTポイント 5,000pt を付与</div><div class="tiny muted">付与は取引台帳に「初回付与」として記録されます。</div></div>'
      +'<div class="flex mt24"><button class="btn btn-o" onclick="S.ob.step=2;render()">戻る</button><button class="btn btn-p btn-lg" style="flex:1" onclick="obFinish()">ウォレットを作成して始める</button></div>';
  }
  return authFrame('<div class="card card-p">'+dots+inner+'</div>');
}
function obToggle(field,v){ var a=S.ob[field]; var i=a.indexOf(v); if(i>=0)a.splice(i,1);else a.push(v); S._keepScroll=true; render(); }
function obNext1(){ var v=document.getElementById('ob-home').value; if(!v){ toast('居住地域を選択してください',true); return; } S.ob.home=v; S.ob.step=2; render(); }
function obNext2(){ if(!S.ob.support.length){ toast('応援したい地域を1つ以上選んでください',true); return; } S.ob.step=3; render(); }
async function obFinish(){
  var u=S.user;
  u.home_region_id=S.ob.home; u.selected_region_id=S.ob.home; u.support_region_ids=S.ob.support.slice(); u.interests=S.ob.cats.slice(); u.onboarded=true;
  var w=walletOf(u.id);
  var granted = false;
  if(!db.transactions.some(function(t){return t.to_wallet_id===w.id&&t.transaction_type==='initial_grant';})){
    w.naft_point_balance += 5000; granted = true;
    addTx({from_wallet_id:'SYSTEM',to_wallet_id:w.id,amount:5000,token_type:'NAFT_POINT',transaction_type:'initial_grant',region_id:u.home_region_id,note:'初回オンボーディング付与'});
  }
  var pr = producerOfUser(u.id); if(pr && !pr.region_id) pr.region_id = u.home_region_id;
  audit('onboarding_complete','user',u.id,u.name+' がオンボーディング完了'+(granted?'（初回付与 5,000pt）':''));
  await saveDB();
  toast(granted?'ウォレットを作成し、5,000ptを付与しました':'設定を保存しました');
  go(roleHome(u.role));
}

function pgRewards(){
  var u=S.user;
  var all = db.user_rewards.filter(function(r){return r.user_id===u.id;});
  // expire check
  all.forEach(function(ur){ var rw=rewardOf(ur.reward_id); if(ur.status==='available'&&rw&&new Date(rw.valid_until)<new Date()){ ur.status='expired'; ur.expired_at=nowISO(); } });
  var tab=S.rwTab;
  var list = all.filter(function(r){ return tab==='available'?r.status==='available':(tab==='used'?r.status==='used':(r.status==='expired'||r.status==='revoked')); });
  return '<p class="small muted mb16">GX還元チケットは、あなたの支援に対する「炭素配当」です。対象地域の店舗・サービスで利用できます（PoCでは利用の可視化のみ）。</p>'
    +'<div class="tabbar mb16">'+[['available','利用可能'],['used','利用済み'],['expired','期限切れ・取消']].map(function(t){return '<button class="'+(tab===t[0]?'on':'')+'" onclick="S.rwTab=\''+t[0]+'\';render()">'+t[1]+'</button>';}).join('')+'</div>'
    +(list.length?'<div class="g3">'+list.map(rewardCardHTML).join('')+'</div>'
      :'<div class="card"><div class="empty"><div class="big">🎫</div>'+(tab==='available'?'利用可能なチケットはありません。1,000pt以上の支援で炭素配当が発行されます。':'該当するチケットはありません。')+'</div></div>');
}
function modalRewardDetail(m){
  var ur = db.user_rewards.find(function(r){return r.id===m.urId;}); if(!ur) return modalFrame('チケット','見つかりません');
  var rw = rewardOf(ur.reward_id);
  var areas = rw.nationwide_available?'全国':(rw.available_prefectures&&rw.available_prefectures.length?rw.available_prefectures.join('・'):regionName(rw.region_id));
  var pjName = rw.related_project_id?(projectOf(rw.related_project_id)||{}).title:null;
  return modalFrame('🎫 '+esc(rw.title),
    '<div class="flex wrap mb8">'+scopeBadge(rw.usage_scope)+badge(RW_STATUS[ur.status]||[ur.status,'b-gray'])+'</div>'
    +'<div class="card card-p" style="background:var(--g50);box-shadow:none"><div class="small" style="line-height:1.9">'+esc(ur.origin_note||rw.description)+'</div></div>'
    +'<div class="mt16 small" style="line-height:2"><b>内容：</b>'+esc(rw.reward_value)+'<br><b>発行元：</b>'+esc(rw.issuer_name)+'<br><b>利用可能エリア：</b>'+esc(areas)+'<br>'
    +(pjName?'<b>関連プロジェクト：</b>'+esc(pjName)+'<br>':'')
    +'<b>発行日：</b>'+fmtDate(ur.issued_at)+'<br><b>有効期限：</b>'+fmtDate(rw.valid_until)
    +(ur.used_at?'<br><b>利用日：</b>'+fmtDate(ur.used_at):'')+'</div>'
    +(ur.status==='available'?'<div class="qr-holder mt16"><div class="qr-target" data-v="'+esc(ur.qr_code_value)+'"></div><div class="mono small">'+esc(ur.qr_code_value)+'</div><div class="tiny muted">店舗でこのQRコードを提示してください</div></div>':'')
    +'<div class="tiny muted mt16">'+esc(rw.description)+'</div>');
}
function pgRegions(){
  var u=S.user;
  return '<p class="small muted mb16">全国の地域GXエリアです。「応援する」に追加すると、ホームやウォレットにおすすめ表示されます。</p>'
    +'<div class="g3">'+db.regions.map(function(r){
      var on = u.support_region_ids.indexOf(r.id)>=0;
      var pjs = db.projects.filter(function(p){return p.region_id===r.id&&p.review_status==='approved';}).length;

        +'<h3 class="mt8">'+esc(r.name)+'</h3><p>'+esc(r.area_description)+'</p>'
        +'<div class="tiny muted mt8">運営：'+esc(r.operator_name)+'（'+(OP_TYPE_MAP[r.operator_type]||r.operator_type)+'）｜承認済みプロジェクト '+pjs+'件</div>'
        +'<button class="btn '+(on?'btn-o':'btn-p')+' btn-sm btn-block mt16" onclick="toggleSupportRegion(\''+r.id+'\')">'+(on?'✓ 応援中（解除する）':'🌱 この地域を応援する')+'</button></div>';
    }).join('')+'</div>';
}
async function toggleSupportRegion(rid){
  var a=S.user.support_region_ids; var i=a.indexOf(rid);
  if(i>=0){a.splice(i,1);}else{a.push(rid);}
  await saveDB(); S._keepScroll=true; toast(i>=0?'応援を解除しました':'応援地域に追加しました');
}
function pgProfile(){
  var u=S.user, w=walletOf(u.id);

    +'<span class="label">お名前</span><input class="input" id="pf-name" value="'+esc(u.name)+'">'
    +'<span class="label">メールアドレス</span><input class="input" value="'+esc(u.email)+'" disabled style="background:var(--gray-bg)">'
    +'<span class="label">ロール</span><input class="input" value="'+ROLE_MAP[u.role]+'" disabled style="background:var(--gray-bg)">'
    +'<span class="label">居住地域</span><select class="select" id="pf-home">'+regionOptions(u.home_region_id,'選択してください')+'</select>'
    +'<span class="label">関心カテゴリ</span><div class="chips">'+Object.keys(CATS).map(function(c){var on=u.interests.indexOf(c)>=0;return '<span class="chip'+(on?' on':'')+'" onclick="toggleInterest(\''+c+'\')">'+CATS[c][1]+' '+CATS[c][0]+'</span>';}).join('')+'</div>'
    +'<button class="btn btn-p mt24" onclick="saveProfile()">保存する</button></div>'
    +(w?'<div class="card card-p mt16"><b class="section-title">ウォレット情報</b><div class="small mt8" style="line-height:2"><b>ウォレットコード：</b><span class="mono">'+esc(w.wallet_code)+'</span><br><b>作成日：</b>'+fmtDate(w.created_at)+'<br><b>オンチェーン連携：</b><span class="badge b-gray">未接続（将来拡張）</span></div></div>':'')
    +'</div>';
}
function toggleInterest(c){ var a=S.user.interests; var i=a.indexOf(c); if(i>=0)a.splice(i,1);else a.push(c); S._keepScroll=true; render(); }
async function saveProfile(){
  var n=document.getElementById('pf-name').value.trim(); if(!n){toast('お名前を入力してください',true);return;}
  S.user.name=n; var h=document.getElementById('pf-home').value; if(h){S.user.home_region_id=h;S.user.selected_region_id=h;}
  audit('profile_update','user',S.user.id,'プロフィールを更新'); await saveDB(); toast('保存しました');
}

/* ---------- support flow ---------- */
function openSupport(pjId){ openModal({type:'support',pjId:pjId,step:1,amount:'',result:null}); }
function modalSupport(m){
  var p = projectOf(m.pjId), w = walletOf(S.user.id);
  if(m.step===1){
    return modalFrame('🌱 プロジェクトを支援する',
      '<b class="small">'+esc(p.title)+'</b><div class="tiny muted">'+esc(p.prefecture)+'・'+esc(p.municipality)+'</div>'
      +'<span class="label">支援額（NaFTポイント）</span><input class="input" type="number" id="sp-amt" min="1" step="100" value="'+esc(m.amount)+'" placeholder="例：1000">'
      +'<div class="chips mt8">'+[500,1000,3000].map(function(a){return '<span class="chip" onclick="document.getElementById(\'sp-amt\').value='+a+'">'+fmtInt(a)+' pt</span>';}).join('')+'</div>'
      +'<div class="small muted mt16">利用可能残高：<b>'+fmtInt(w.naft_point_balance)+' pt</b></div>'
      +'<div class="tiny muted mt8">1,000pt以上の支援で、GX還元チケット（炭素配当）が発行されます。</div>'
      +'<button class="btn btn-p btn-lg btn-block mt16" onclick="confirmSupport()">確認画面へ</button>');
  }
  if(m.step===2){
    var amt=m.amount, co2 = amt/p.target_amount*p.estimated_co2_reduction*1000;
    return modalFrame('支援内容の確認',
      '<div class="card card-p" style="background:var(--g50);box-shadow:none"><div class="kv"><span>プロジェクト</span><b>'+esc(p.title)+'</b></div>'
      +'<div class="kv mt8"><span>支援額</span><b style="font-size:17px;color:var(--g700)">'+fmtInt(amt)+' pt</b></div>'
      +'<div class="kv mt8"><span>推定CO2貢献</span><b>'+fmt(co2)+' kg-CO2</b></div>'
      +'<div class="kv mt8"><span>支援後の残高</span><b>'+fmtInt(walletOf(S.user.id).naft_point_balance-amt)+' pt</b></div></div>'
      +'<div class="tiny muted mt16">支援は取引台帳に記録されます。NaFTポイントはPoC用であり、返金・換金はできません。</div>'
      +'<div class="flex mt16"><button class="btn btn-o" onclick="S.modal.step=1;render()">戻る</button><button class="btn btn-p btn-lg" style="flex:1" onclick="execSupport()">この内容で支援する</button></div>');
  }
  // step3: done
  var r=m.result;
  return modalFrame('🎉 支援ありがとうございます！',
    '<div class="center" style="padding:8px 0 4px;font-size:40px">🌱</div>'
    +'<div class="center"><b>'+esc(p.title)+'</b> に <b style="color:var(--g700)">'+fmtInt(r.amount)+' pt</b> を支援しました。</div>'
    +'<div class="card card-p mt16" style="background:var(--g50);box-shadow:none;text-align:center"><div class="small muted">あなたの支援により、</div><div style="font-size:21px;font-weight:800;color:var(--g700)">推定 '+fmt(r.co2)+' kg-CO2</div><div class="small muted">分の地域GX活動に参加しました。</div></div>'
    +(r.reward?'<div class="reward-card mt16"><div class="rt"><h3>🎫 '+esc(r.reward.title)+' を獲得！</h3>'+scopeBadge(r.reward.usage_scope)+'</div><div class="rb small">'+esc(r.reward.reward_value)+'｜発行元：'+esc(r.reward.issuer_name)+'<div class="tiny muted mt8">「GX還元チケット」ページからQRコードを表示できます。</div></div></div>':'')
    +'<div class="flex mt16"><button class="btn btn-o" style="flex:1" onclick="closeModal()">閉じる</button><a class="btn btn-p" style="flex:1" href="#/app/rewards" onclick="closeModal()">チケットを見る</a></div>');
}
function confirmSupport(){
  var v = parseInt(document.getElementById('sp-amt').value,10);
  var w = walletOf(S.user.id), p = projectOf(S.modal.pjId);
  if(!v||v<=0){ toast('支援額を入力してください',true); return; }
  if(v>w.naft_point_balance){ toast('残高が不足しています（残高 '+fmtInt(w.naft_point_balance)+' pt）',true); return; }
  if(p.review_status!=='approved'){ toast('このプロジェクトは現在支援できません',true); return; }
  S.modal.amount=v; S.modal.step=2; render();
}
async function execSupport(){
  var m=S.modal, p=projectOf(m.pjId), u=S.user, w=walletOf(u.id), amt=m.amount;
  if(p.review_status!=='approved'||amt>w.naft_point_balance){ toast('支援を実行できませんでした',true); return; }
  w.naft_point_balance -= amt;
  p.current_amount += amt;
  p.support_count += 1;
  if(w.supported_project_ids.indexOf(p.id)<0) w.supported_project_ids.push(p.id);
  w.total_supported_amount += amt;
  var co2 = Math.round(amt/p.target_amount*p.estimated_co2_reduction*1000*10)/10;
  w.total_co2_contribution = Math.round((w.total_co2_contribution+co2)*10)/10;
  var t = addTx({from_wallet_id:w.id,to_wallet_id:'PROJECT_POOL',amount:amt,token_type:'NAFT_POINT',transaction_type:'support_project',related_project_id:p.id,region_id:p.region_id,note:p.title+'への支援'});
  var issued=null;
  if(amt>=1000){
    var rw = db.rewards.find(function(r){return r.status==='active'&&r.related_project_id===p.id;})
      || db.rewards.find(function(r){return r.status==='active'&&r.region_id===p.region_id;})
      || db.rewards.find(function(r){return r.status==='active'&&r.nationwide_available;});
    if(rw){
      var ur = {id:uid('ur'),user_id:u.id,reward_id:rw.id,status:'available',qr_code_value:'NAFT-RWD-'+rnd(10),
        origin_note:p.title+'への支援により発行されました。あなたの支援により、推定'+fmt(co2)+'kg-CO2分の地域GX活動に参加しました。',
        issued_at:nowISO(),used_at:null,expired_at:null};
      db.user_rewards.unshift(ur);
      addTx({from_wallet_id:'SYSTEM',to_wallet_id:w.id,amount:1,token_type:'CARBON_REWARD',transaction_type:'reward_issue',related_project_id:p.id,related_reward_id:rw.id,region_id:p.region_id,note:rw.title+'の発行（炭素配当）'});
      issued = rw;
    }
  }
  audit('support_project','transaction',t.transaction_code,u.name+' が「'+p.title+'」へ '+fmtInt(amt)+'pt を支援'+(issued?'（チケット発行：'+issued.title+'）':''));
  await saveDB();
  S.modal={type:'support',pjId:p.id,step:3,amount:amt,result:{amount:amt,co2:co2,reward:issued}};
  render();
}

/* ---------- reserve flow ---------- */
function openReserve(pjId){ openModal({type:'reserve',pjId:pjId}); }
function modalReserve(m){
  var p=projectOf(m.pjId);
  return modalFrame('📝 クレジット購入予約（意思表示）',
    '<b class="small">'+esc(p.title)+'</b><div class="tiny muted">推定CO2削減量：'+fmt(p.estimated_co2_reduction)+' t-CO2</div>'
    +'<div class="notice-inline mt16">これは実際の売買・決済ではありません。このプロジェクトが将来カーボンクレジット化された場合に「購入を検討したい」という意思表示として記録されます。</div>'
    +'<span class="label">希望数量（t-CO2）</span><input class="input" type="number" id="rv-qty" min="0.1" step="0.1" value="1.0">'
    +'<span class="label">想定単価（参考値）</span><input class="input" value="3,000 円 / t-CO2（デモ用参考単価）" disabled style="background:var(--gray-bg)">'
    +'<button class="btn btn-p btn-lg btn-block mt24" onclick="execReserve()">この内容で予約を登録する</button>');
}
async function execReserve(){
  var m=S.modal, p=projectOf(m.pjId), u=S.user;
  var q = parseFloat(document.getElementById('rv-qty').value);
  if(!q||q<=0){ toast('数量を入力してください',true); return; }
  q = Math.round(q*10)/10;
  var total = Math.round(q*3000);
  var res = {id:uid('rsv'),user_id:u.id,project_id:p.id,quantity:q,expected_unit_price:3000,total_expected_price:total,status:'registered',created_at:nowISO()};
  db.reservations.unshift(res);
  var t = addTx({from_wallet_id:walletOf(u.id).id,to_wallet_id:'RESERVATION_BOOK',amount:total,token_type:'CREDIT_RESERVATION',transaction_type:'reserve_credit',related_project_id:p.id,region_id:p.region_id,note:p.title+'のクレジット購入予約（'+q+'t-CO2・意思表示）'});
  audit('reserve_credit','reservation',res.id,u.name+' が「'+p.title+'」のクレジット購入予約（'+q+'t-CO2／想定'+fmtInt(total)+'円）を登録');
  await saveDB();
  closeModal(); toast('購入予約（意思表示）を登録しました');
}
</script>
<script>
/* ---------- producer ---------- */
var PRODUCER_TITLES = {home:'事業者ホーム',projects:'マイプロジェクト',new:'プロジェクト登録',verification:'MRV検証ワークベンチ',tx:'関連取引'};
function producerShell(active, content){
  var nav=[{label:'事業者メニュー'},
    {key:'home',href:'#/producer',icon:'🏠',name:'ホーム'},
    {key:'projects',href:'#/producer/projects',icon:'📁',name:'マイプロジェクト'},
    {key:'new',href:'#/producer/new',icon:'➕',name:'プロジェクト登録'},
    {key:'primary',href:'#/primary-mrv',icon:'🌾',name:'Primary MRV'},
    {key:'tx',href:'#/producer/transactions',icon:'📒',name:'関連取引'},
    {label:'マーケット'},
    {key:'market',href:'#/market',icon:'🌏',name:'全国マーケット'}];
  return shellFrame(nav, active, PRODUCER_TITLES[active]||'事業者',content);
}
function myProducer(){ return producerOfUser(S.user.id); }
function pgProducerHome(){
  var pr=myProducer();
  if(!pr) return '<div class="empty">事業者情報が見つかりません。</div>';
  var pjs = db.projects.filter(function(p){return p.producer_id===pr.id;});
  var approved = pjs.filter(function(p){return p.review_status==='approved';});
  var totalSup = approved.reduce(function(s,p){return s+p.current_amount;},0);
  var supporters = approved.reduce(function(s,p){return s+p.support_count;},0);
  var pending = pjs.filter(function(p){return p.review_status==='pending_review';}).length;
  var needFix = pjs.filter(function(p){return p.review_status==='revision_required';}).length;
  return '<h2 style="font-size:18px;font-weight:800">'+esc(pr.organization_name)+' 🌾</h2>'
    +'<p class="small muted mt8">活動地域：'+esc(regionName(pr.region_id))+'｜認証状態：'+badge(pr.verification_status==='verified'?['確認済み事業者','b-green']:['確認待ち','b-amber'])+'</p>'
    +'<div class="stats mt16">'
    +statCard('登録プロジェクト',pjs.length,'件','承認済み '+approved.length+'件')
    +statCard('累計支援額',fmtInt(totalSup),'pt','承認済みプロジェクト合計')
    +statCard('支援者数',supporters,'人','のべ人数')
    +statCard('審査状況',pending,'件 審査待ち',needFix?'<span style="color:var(--amber)">差し戻し '+needFix+'件</span>':'差し戻しなし')
    +'</div>'
    +(needFix?'<div class="notice-inline mt16" style="background:var(--amber-bg);border-color:#e8d3a0;color:var(--amber)">差し戻しされたプロジェクトがあります。審査コメントを確認し、修正のうえ再提出してください。</div>':'')
    +'<div class="between mt32 mb16"><b class="section-title">📁 マイプロジェクト</b><a class="btn btn-p btn-sm" href="#/producer/new">＋ 新規プロジェクト登録</a></div>'
    +producerProjectTable(pjs.slice(0,6))
    +'<div class="card card-p mt24" style="background:var(--g50);box-shadow:none"><b class="small">💡 承認までの流れ</b><div class="small muted mt8" style="line-height:1.9">1. プロジェクトを登録（下書き保存可）→ 2. 審査に提出 → 3. 地域管理者が証憑・算定根拠を確認 → 4. 承認されると全国マーケットに掲載され、市民からの支援を受けられます。</div></div>';
}

  if(!pjs.length) return '<div class="card"><div class="empty"><div class="big">📁</div>まだプロジェクトがありません。「新規プロジェクト登録」から始めましょう。</div></div>';
  return '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>プロジェクト</th><th>カテゴリ</th><th>審査状況</th><th style="text-align:right">支援額</th><th style="text-align:right">支援者</th><th></th></tr></thead><tbody>'
    +pjs.map(function(p){return '<tr><td><b class="small">'+esc(p.title)+'</b><div class="tiny muted">'+esc(p.prefecture)+'・'+esc(p.municipality)+'</div></td>'

      +'<td class="right small"><b>'+fmtInt(p.current_amount)+'</b> / '+fmtInt(p.target_amount)+' pt</td><td class="right small">'+p.support_count+'人</td>'
      +'<td class="right"><a class="btn btn-o btn-sm" href="#/producer/project/'+p.id+'">管理</a></td></tr>';}).join('')
    +'</tbody></table></div></div>';
}
function pgProducerProjects(){
  var pr=myProducer(); var pjs=db.projects.filter(function(p){return p.producer_id===pr.id;});
  return '<div class="between mb16"><span class="small muted">登録済み '+pjs.length+'件</span><a class="btn btn-p btn-sm" href="#/producer/new">＋ 新規プロジェクト登録</a></div>'+producerProjectTable(pjs);

function pgProjectForm(editId){
  var pr=myProducer();
  var p = editId ? projectOf(editId) : null;
  if(editId && (!p || p.producer_id!==pr.id)) return '<div class="empty">編集対象が見つかりません。</div>';
  if(p && ['draft','revision_required'].indexOf(p.review_status)<0) return '<div class="empty">このプロジェクトは現在編集できません（審査中または公開中）。</div>';
  var v = p || {title:'',region_id:pr.region_id||'',area_name:'',category:'',description:'',reduction_type:'削減',estimated_co2_reduction:'',calculation_method:'',start_date:'',end_date:'',target_amount:'',regional_return_plan:'',related_url:'',contact_email:pr.contact_email||'',is_nationwide_visible:true};
  var evs = p ? db.evidences.filter(function(e){return e.project_id===p.id;}) : [];
  return '<div style="max-width:760px">'
    +(p&&p.review_status==='revision_required'?'<div class="notice-inline mb16" style="background:var(--amber-bg);border-color:#e8d3a0;color:var(--amber)">このプロジェクトは差し戻されています。審査コメントを確認のうえ修正してください。</div>':'')

async function saveProject(editId, submit){
  var pr=myProducer();
  var g=function(id){return document.getElementById(id).value.trim();};
  var title=g('pf-title'),region=g('pf-region'),area=g('pf-area'),cat=g('pf-cat'),co2=parseFloat(g('pf-co2')),target=parseInt(g('pf-target'),10),desc=g('pf-desc'),method=g('pf-method');
  if(submit){
    if(!title||!region||!area||!cat||!desc||!method||!co2||co2<=0||!target||target<=0){ toast('必須項目（*）をすべて入力してください',true); return; }
  } else if(!title){ toast('下書き保存にはプロジェクト名が必要です',true); return; }
  var r=region?regionOf(region):null;
  var p = editId?projectOf(editId):null;
  if(!p){
    p={id:uid('pj'),producer_id:pr.id,created_at:nowISO(),current_amount:0,support_count:0,trust_score:50,status:'inactive',main_image_url:'',region_scope:'regional'};
    db.projects.unshift(p);
  }
  Object.assign(p,{title:title,region_id:region||null,prefecture:r?r.prefecture:'',municipality:r?r.municipality:'',area_name:area,category:cat||'Other',
    description:desc,location:(r?r.prefecture+' ':'')+area,reduction_type:g('pf-rtype'),estimated_co2_reduction:co2||0,calculation_method:method,
    target_amount:target||0,start_date:g('pf-start')?new Date(g('pf-start')).toISOString():null,end_date:g('pf-end')?new Date(g('pf-end')).toISOString():null,
    regional_return_plan:g('pf-plan'),related_url:g('pf-url'),contact_email:g('pf-mail'),is_nationwide_visible:document.getElementById('pf-nw').checked,
    review_status: submit?'pending_review':'draft'});
  var files=document.getElementById('pf-ev').files;
  for(var i=0;i<files.length;i++){
    db.evidences.push({id:uid('ev'),project_id:p.id,file_url:'',file_name:files[i].name,file_type:(files[i].name.split('.').pop()||'file'),description:g('pf-evdesc'),uploaded_by:pr.id,created_at:nowISO()});
  }
  if(submit) db.reviews.push({id:uid('rev'),project_id:p.id,reviewer_id:null,action:'submit',comment:'審査に提出されました。',created_at:nowISO()});
  audit(submit?'project_submit':'project_draft_save','carbon_project',p.id,'「'+p.title+'」を'+(submit?'審査に提出':'下書き保存'));
  await saveDB();
  toast(submit?'審査に提出しました。承認までお待ちください。':'下書きを保存しました');
  go('#/producer/projects');
}

function regionStats(rid){
  var citizens = db.users.filter(function(u){return u.role==='citizen'&&(u.home_region_id===rid||u.support_region_ids.indexOf(rid)>=0);}).length;
  var producers = db.producers.filter(function(p){return p.region_id===rid;}).length;
  var pjs = db.projects.filter(function(p){return p.region_id===rid;});
  var approved = pjs.filter(function(p){return p.review_status==='approved';});
  var txs = db.transactions.filter(function(t){return t.region_id===rid;});
  var supported = txs.filter(function(t){return t.transaction_type==='support_project';}).reduce(function(s,t){return s+t.amount;},0);
  var circulation = txs.filter(function(t){return t.token_type==='NAFT_POINT';}).reduce(function(s,t){return s+t.amount;},0);
  var co2 = approved.reduce(function(s,p){return s+p.estimated_co2_reduction*Math.min(1,p.current_amount/Math.max(1,p.target_amount));},0);
  var rwIds = db.rewards.filter(function(r){return r.region_id===rid;}).map(function(r){return r.id;});
  var issued = db.user_rewards.filter(function(ur){return rwIds.indexOf(ur.reward_id)>=0;});
  return {citizens:citizens,producers:producers,projects:pjs.length,approved:approved.length,pending:pjs.filter(function(p){return p.review_status==='pending_review';}).length,
    supported:supported,circulation:circulation,co2:co2,ticketsIssued:issued.length,ticketsUsed:issued.filter(function(u){return u.status==='used';}).length,
    txs:txs,popular:approved.slice().sort(function(a,b){return b.current_amount-a.current_amount;}).slice(0,5)};
}

async function reviewAction(pjId, action){
  var p=projectOf(pjId);
  if(!canReviewProject(p)||!({approve:1,request_revision:1,reject:1,suspend:1})[action]){toast('Human reviewer permission required',true);return;}
  var comment=document.getElementById('rv-comment').value.trim();
  if(action!=='approve'&&!comment){ toast('差し戻し・却下・停止にはコメントが必要です',true); return; }
  var run=latestVerificationRun(p.id);
  if(action==='approve'&&!run){ toast('承認前に証憑整理・検証補助を実行してください',true); return; }
  if(action==='approve'&&!verificationRunIsCurrent(p,run)){ toast('入力または証憑が更新されています。検証補助を再実行してください',true); return; }
  if(action==='approve'&&run.outcome==='abstain'&&comment.length<20){ toast('判定保留を上書きする理由を20文字以上で記録してください',true); return; }
  if(action==='approve'){
    if(['pending_review','revision_required','suspended'].indexOf(p.review_status)<0) return;
    var actorId=S.user.id;
    var prepared=buildEnvironmentalRecord(p,run,actorId,comment||'人間の審査者が証憑と算定根拠を確認しました。',(db.environmental_records[0]||{}).record_hash);
    var checkedHash=await sha256Canonical(recordPayload(prepared));
    if(!S.user||S.user.id!==actorId||!canReviewProject(p)||!verificationRunIsCurrent(p,run)||latestVerificationRun(p.id)!==run||['pending_review','revision_required','suspended'].indexOf(p.review_status)<0||checkedHash!==prepared.environmental_record_hash||prepared.previous_record_hash!==((db.environmental_records[0]||{}).record_hash||null)) return;
  }
  var map={approve:'approved',request_revision:'revision_required',reject:'rejected',suspend:'suspended'};
  p.review_status=map[action]; p.status = action==='approve'?'active':'inactive';
  if(action==='approve'&&p.trust_score<70) p.trust_score=70;
  db.reviews.push({id:uid('rev'),project_id:p.id,reviewer_id:S.user.id,action:action,comment:comment||'承認します。',created_at:nowISO()});
  if(run){ run.final_decision=map[action]; run.final_reviewer_id=S.user.id; run.final_decided_at=nowISO(); }
  if(action==='approve') createEnvironmentalRecord(p,run,comment||'人間の審査者が証憑と算定根拠を確認しました。',prepared);
  if(action==='suspend'){
    var current=environmentalRecordFor(p.id); if(current) current.status='suspended_candidate';
  }
  var lbl={approve:'承認',request_revision:'差し戻し',reject:'却下',suspend:'停止'}[action];
  audit('project_'+action,'carbon_project',p.id,'「'+p.title+'」を'+lbl+(comment?'（'+comment.slice(0,40)+'）':''));
  await saveDB();
  closeModal(); toast('プロジェクトを'+lbl+'しました');
}

  var txs=db.transactions;
  var supported=txs.filter(function(t){return t.transaction_type==='support_project';}).reduce(function(s,t){return s+t.amount;},0);
  var circulation=txs.filter(function(t){return t.token_type==='NAFT_POINT';}).reduce(function(s,t){return s+t.amount;},0);
  var co2=approved.reduce(function(s,p){return s+p.estimated_co2_reduction*Math.min(1,p.current_amount/Math.max(1,p.target_amount));},0);
  var issued=db.user_rewards.length, used=db.user_rewards.filter(function(u){return u.status==='used';}).length;

/* ---------- Primary Industry MRV: reference-snapshot prototype, not certification ---------- */
var AG005_RULE = Object.freeze({methodology_id:'AG-005',methodology_version:'3.1-reference',rule_version:'naft-ag005-0.1',
  source:'https://public-comment.e-gov.go.jp/pcm/download?seqNo=0000281460',source_checked_at:'2026-09-10',
  source_status:'public_comment_reference_adoption_unconfirmed',current_version_verified:false,minimum_extension_days:7,minimum_baseline_years:2});
var METHODOLOGY_RULE_PACKS = {'AG-005':AG005_RULE};
var PRIMARY_BOUNDARY = 'Methodology-aware Demo / Off-chain Prototype. PASS means NaFT internal readiness only. Not J-Credit certification. No external registry, issuance, sale or formal retirement.';
function primaryHash(v){return digestText(canonicalize(v));}
function primaryClone(v){return JSON.parse(JSON.stringify(v));}
function ensurePrimarySchema(d){
  ['programs','farmers','fields','activities','evidence_manifests','methodology_runs','primary_records','primary_reviews','evidence_content_checks'].forEach(function(k){if(!d[k]) d[k]=[];});
  // Historical events are anchored as legacy bytes; this does not attest their original creation.
  if(!d.primary_schema_version){
    d.primary_schema_version=1;
    d.audit_chain={legacy_count:d.audit_logs.length,legacy_digest:primaryHash(d.audit_logs),event_count:0,head_hash:primaryHash(d.audit_logs)};
  }
  return d;
}
function auditEventPayload(e){var p=Object.assign({},e);delete p.event_hash;return p;}
function verifyAuditChain(d){
  d=d||db;var c=d.audit_chain;
  if(!c||!Array.isArray(d.audit_logs)) return {status:'BROKEN',reason:'MISSING_ANCHOR'};
  var logs=d.audit_logs, n=c.event_count;
  if(!Number.isInteger(n)||n<0||!Number.isInteger(c.legacy_count)||c.legacy_count<0||logs.length!==n+c.legacy_count) return {status:'BROKEN',reason:'COUNT_MISMATCH'};
  var legacy=logs.slice(n),head=primaryHash(legacy);
  if(head!==c.legacy_digest) return {status:'BROKEN',reason:'LEGACY_CHANGED'};
  for(var i=n-1;i>=0;i--){var e=logs[i];
    if(!e||typeof e!=='object'||e.sequence!==n-i||e.previous_hash!==head||e.payload_digest!==primaryHash(e.note)||e.event_hash!==primaryHash(auditEventPayload(e))) return {status:'BROKEN',reason:'EVENT_CHANGED',event_id:e.id};
    head=e.event_hash;
  }
  return head===c.head_hash?{status:'VALID',event_count:n,legacy_count:c.legacy_count,head_hash:head}:{status:'BROKEN',reason:'HEAD_MISMATCH'};
}
async function hashEvidenceBytes(bytes){
  var copy=new Uint8Array(bytes); // Copy before awaiting, so caller cannot alter an in-flight digest.
  if(typeof crypto!=='undefined'&&crypto.subtle){try{
    var result=await crypto.subtle.digest('SHA-256',copy);
    return Array.from(new Uint8Array(result)).map(function(n){return ('0'+n.toString(16)).slice(-2);}).join('');
  }catch(e){ /* Identical standard SHA-256 fallback. */ }}
  return digestBytes(copy);
}
function primaryUser(){var u=S.user&&findUser(S.user.id);return u&&u.status==='active'&&u.role===S.user.role?u:null;}
function primaryCanReview(){var u=primaryUser();return !!(u&&isPlatformRole(u.role));}
function primaryCanOperate(program){var u=primaryUser();return !!(u&&(isPlatformRole(u.role)||(u.role==='producer'&&program&&program.owner_user_id===u.id)));}
function primaryActivity(id){return db.activities.find(function(a){return a.id===id;});}
function primaryProgram(a){return a&&db.programs.find(function(p){return p.id===a.program_id;});}
function primaryGuard(a,review){
  if(!a||primaryActivity(a.id)!==a) throw new Error('ACTIVITY_NOT_FOUND');
  if(!(review?primaryCanReview():primaryCanOperate(primaryProgram(a)))) throw new Error('ROLE_BLOCKED');
  if(verifyAuditChain().status!=='VALID') throw new Error('AUDIT_CHAIN_BROKEN');
}
function primaryIdentity(a){
  var p={};['field_id','methodology_id','crop_year','activity_type','activity_start','activity_end'].forEach(function(k){p[k]=a[k];});
  return {canonical:p,hash:primaryHash(p)};
}
function primaryConflict(a,collection){return (collection||db.activities).find(function(b){return b.id!==a.id&&b.field_id===a.field_id&&b.methodology_id===a.methodology_id&&b.activity_type===a.activity_type&&
  (primaryIdentity(a).hash===(b.field_identity_hash||primaryIdentity(b).hash)||(a.activity_start<=b.activity_end&&a.activity_end>=b.activity_start));});}
function isoDay(s){if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;var n=Date.parse(s+'T00:00:00Z');return Number.isFinite(n)&&new Date(n).toISOString().slice(0,10)===s?n:null;}
function inclusiveDays(start,end){var s=isoDay(start),e=isoDay(end);return s===null||e===null||e<s?null:(e-s)/86400000+1;}
function drainageDays(p){
  if(!p||isoDay(p.heading_date)===null||inclusiveDays(p.start,p.end)===null||p.heading_date<=p.start) return null;
  var end=p.end<p.heading_date?p.end:new Date(isoDay(p.heading_date)-86400000).toISOString().slice(0,10);
  return inclusiveDays(p.start,end);
}
function primaryEvidence(a){return db.evidence_manifests.filter(function(e){return e.activity_id===a.id;}).sort(function(x,y){return x.evidence_id.localeCompare(y.evidence_id);});}

  if(!primaryUser()||!(primaryUser().role==='producer'||primaryCanReview())) return html+'</main>'+pubFooter();
  var a=primarySelected(),visible=db.activities.filter(function(x){return primaryCanOperate(primaryProgram(x));});
  html+='<details class="card card-p mt16"'+(!a?' open':'')+'><summary>Register Program / Farmer / Field / Activity (JSON)</summary><p class="small">Same program and farmer names reuse their records within this operator account. Field IDs are shared across this dataset. Dates and names below are synthetic examples; edit before registration. Fields with changed ownership or area require review outside this prototype.</p>'
    +'<textarea id="pm-json" rows="13" style="width:100%" aria-label="Activity JSON">'+esc(JSON.stringify(primaryExample(),null,2))+'</textarea><button class="btn btn-p mt8" onclick="primaryUI(\'register\')">Register activity draft</button></details>';
  if(!a) return html+'</main>'+pubFooter();
  var run=db.methodology_runs.filter(function(r){return r.activity_id===a.id;}).slice(-1)[0],record=db.primary_records.find(function(r){return r.activity_id===a.id;}),ev=primaryEvidence(a),assessment=assessAG005(a),agg=programAggregate(a.program_id),chain=verifyAuditChain();
  html+='<label class="mt16" style="display:block">Activity <select onchange="primarySelect(this.value)">'+visible.map(function(x){return '<option value="'+esc(x.id)+'"'+(a.id===x.id?' selected':'')+'>'+esc(x.field_id+' / '+x.crop_year)+'</option>';}).join('')+'</select></label>'
    +'<div class="card card-p mt16"><b>Program → Farmers → Fields → Activities → Evidence → Candidate Records</b><p>'+esc(agg.farmers+' farmers / '+agg.fields+' fields / '+agg.area_ha+' ha / '+agg.activities+' activities / '+agg.evidence+' evidence / '+agg.candidate_records+' candidate records')+'</p><p class="small">Area counts each field once. No certified quantity or income forecast.</p><code style="overflow-wrap:anywhere">Field/activity identity: '+esc(primaryIdentity(a).hash)+'</code></div>'
    +'<div class="card card-p mt16"><h2>1. Evidence content → SHA-256 manifest</h2><p class="small">Select actual bytes; file content stays on your device and is not stored. Keep originals for human inspection. Maximum 5 MiB per file.</p><label>Evidence type / year <select id="pm-type">'+assessment.evidence_completeness.missing.map(function(t){return '<option>'+esc(t)+'</option>';}).join('')+'</select></label> <input id="pm-file" type="file" aria-label="Evidence file"><label>Source <input id="pm-source" value="Operator-provided original" aria-label="Evidence source"></label>'
    +'<button class="btn btn-p mt8" onclick="primaryUI(\'evidence\')">Hash selected file</button> <button class="btn btn-o mt8" onclick="primaryUI(\'sample\')">Add SYNTHETIC demo evidence</button><p class="small">Synthetic evidence exercises the hash pipeline; it does not document climate activity.</p>'
    +'<details><summary>Evidence inventory ('+ev.length+')</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(JSON.stringify(ev,null,2))+'</pre></details>'
    +'<label>Recheck original <select id="pm-evidence-id">'+ev.map(function(e){return '<option value="'+esc(e.evidence_id)+'">'+esc(e.original_filename)+'</option>';}).join('')+'</select></label><input id="pm-check-file" type="file" aria-label="File for integrity recheck"><button class="btn btn-o mt8" onclick="primaryUI(\'verify\')">Compare content hash</button></div>'
    +'<div class="card card-p mt16"><h2>2. Deterministic MRV Readiness</h2><button class="btn btn-p" onclick="primaryUI(\'run\')">Run AG-005 readiness</button><p><b>'+esc(run?(primaryRunCurrent(a,run)?run.eligibility_status:'STALE — rerun required'):'Not run')+'</b> · PASS / REVIEW / FAIL / MISSING are internal checks only.</p>'
    +'<p>'+esc('Baseline '+assessment.baseline_days+' days / Project '+assessment.project_days+' days / Extension '+assessment.extension_days+' days')+'</p><table><thead><tr><th>Check</th><th>Status</th><th>Detail</th></tr></thead><tbody>'+assessment.checks.map(function(c){return '<tr><td>'+esc(c.id)+'</td><td>'+esc(c.status)+'</td><td>'+esc(c.note)+'</td></tr>';}).join('')+'</tbody></table><details class="mt8"><summary>Calculation Assist — CONFIG REQUIRED</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(JSON.stringify(assessment.calculation,null,2))+'</pre></details></div>'
    +'<div class="card card-p mt16"><h2>3. Human Review → Candidate Record</h2><p>Inspect original files and rule gaps. Approval records a reviewed draft; it does not resolve CONFIG REQUIRED or certify a reduction. FAIL / MISSING cannot be approved. Explain the remaining limitations in at least 20 characters.</p><textarea id="pm-note" rows="3" style="width:100%" aria-label="Human review reason"></textarea><div class="flex mt8"><button class="btn btn-p" onclick="primaryUI(\'approve\')">Human: approve draft</button><button class="btn btn-o" onclick="primaryUI(\'reject\')">Human: reject</button><button class="btn btn-o" onclick="primaryUI(\'duplicate\')">Try duplicate record → BLOCKED</button></div><p>'+esc(record?'Human approved / candidate_not_formally_issued':'No candidate record')+'</p></div>'
    +'<div class="card card-p mt16"><h2>4. Monitoring Package</h2><p>JSON includes the reviewed snapshot, evidence hashes, eligibility, calculation inputs, reviewer, missing parameters, audit reference and candidate record hash. Status: incomplete_reviewed_draft. External verifier acceptance is not established.</p><button class="btn btn-p" onclick="primaryUI(\'export\')">Export Monitoring Package JSON</button>'
    +(record?'<details><summary>Candidate record</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(JSON.stringify(record,null,2))+'</pre></details>':'')+'</div>'
    +'<div class="card card-p mt16"><h2>Audit chain: '+esc(chain.status)+'</h2><button class="btn btn-o" onclick="primaryUI(\'audit\')">Verify audit chain</button><p class="small">Detects changed, missing or reordered events against this local checkpoint. Complete state replacement and recomputed hashes cannot be detected without an independent anchor.</p></div></main>'+pubFooter();
  return html;
}

/* ---------- init ---------- */
(async function init(){
  try{
    await loadDB();
    var sid = await store.get(SES_KEY);
    if(sid){ var u=db.users.find(function(x){return x.id===sid;}); if(u&&u.status==='active') S.user=u; }
  }catch(e){ console.error(e); if(!db) db=seedDB(); }
  render();
})();
</script>
</body>
